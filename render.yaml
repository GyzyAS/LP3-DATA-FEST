services:
  - type: web
    name: data-fest
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: data-fest-db
          property: connectionString

databases:
  - name: data-fest-db
    plan: free
    databaseName: datafest
    user: datafest
